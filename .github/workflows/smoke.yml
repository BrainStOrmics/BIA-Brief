name: Smoke CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BIA_BRIEF_SKILL_DIR: ${{ github.workspace }}/skill-branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Skill contract branch
        uses: actions/checkout@v4
        with:
          repository: BrainStOrmics/BIA-Brief
          ref: codex/bia-brief-skill
          path: skill-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile core modules and entry scripts
        run: |
          python -m compileall -q scripts src

      - name: Check CLI help
        run: |
          python scripts/doctor.py --help
          python scripts/run_project.py --help
          python scripts/run_batch.py --help

      - name: Run full test suite
        run: |
          python -m pytest -q tests

      - name: Build and verify wheel
        run: |
          python -m build --wheel
          python scripts/verify_wheel_contents.py
