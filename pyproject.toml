[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bia-brief"
version = "0.2.1"
description = "Automated bioinformatics report generation from project figures, scripts, and metadata."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "BrainStOrmics" }
]
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "deepagents>=0.6,<0.7",
  "markdown>=3.5",
  "Pillow>=10.0",
  "playwright>=1.40",
  "pypdf>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
]

[project.urls]
Repository = "https://github.com/BrainStOrmics/BIA-Brief"

[project.scripts]
bia-brief = "Brief.cli:main"
bia-brief-setup = "Brief.cli:setup_cli"
bia-brief-project = "Brief.cli:run_project_cli"
bia-brief-batch = "Brief.cli:run_batch_cli"
bia-brief-doctor = "Brief.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"Brief.prompts" = ["*.md"]
"Brief.resources" = ["templates/**/*.md", "templates/assets/BGI_SY/pics/*", "config/*.yaml"]
"Brief.resources.config" = ["*.yaml*"]
