[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bia-brief"
version = "0.1.0"
description = "Automated bioinformatics report generation from project figures, scripts, and metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "BrainStOrmics" }
]
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "deepagents>=0.6,<1.0",
  "markdown>=3.5",
  "Pillow>=10.0",
  "playwright>=1.40",
  "pypdf>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/BrainStOrmics/BIA-Brief"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"Brief.prompts" = ["*.md"]
